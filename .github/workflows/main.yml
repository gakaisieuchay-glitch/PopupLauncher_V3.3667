name: Build Popup Launcher APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. DEBUG REPOSITORY CONTENTS
      # ============================================================
      - name: Show repository contents
        shell: bash
        run: |
          echo "===== Repository root ====="
          pwd
          ls -la

          echo ""
          echo "===== Files ====="
          find . -maxdepth 4 -type f | sort | head -300

      # ============================================================
      # 3. LOCATE OR EXTRACT ANDROID PROJECT
      #
      # Supports:
      # A) Android source directly in repository
      # B) Android source inside a ZIP file
      # ============================================================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(
            find "$GITHUB_WORKSPACE" \
              -path "$GITHUB_WORKSPACE/.git" -prune -o \
              -name "settings.gradle.kts" -o -name "settings.gradle" \
              -type f -print | head -n 1
          )

          if [ -n "${SETTINGS_FILE:-}" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "Android project found directly:"
            echo "$PROJECT_DIR"
          else
            echo "No direct Android project found."
            echo "Searching for ZIP files..."

            ZIP_FILE=$(
              find "$GITHUB_WORKSPACE" \
                -path "$GITHUB_WORKSPACE/.git" -prune -o \
                -type f -name "*.zip" -print | head -n 1
            )

            if [ -z "${ZIP_FILE:-}" ]; then
              echo "::error::No Android Gradle project and no ZIP file found."
              echo "Upload the extracted Android source or the project ZIP."
              exit 1
            fi

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            EXTRACT_DIR="$RUNNER_TEMP/popup-launcher-project"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE=$(
              find "$EXTRACT_DIR" \
                -name "settings.gradle.kts" -o -name "settings.gradle" \
                -type f -print | head -n 1
            )

            if [ -z "${SETTINGS_FILE:-}" ]; then
              echo "::error::The ZIP was extracted, but no Android Gradle project was found."
              echo "===== Extracted files ====="
              find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -500
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            echo "Android project found inside ZIP:"
            echo "$PROJECT_DIR"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 4. SHOW PROJECT STRUCTURE
      # ============================================================
      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "PROJECT_DIR=$PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "===== Project root ====="
          ls -la

          echo ""
          echo "===== Important Gradle files ====="
          find . -maxdepth 3 \
            \
              -name "settings.gradle.kts" -o \
              -name "settings.gradle" -o \
              -name "build.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "gradle.properties" \
            \
            -type f -print | sort

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::app module directory missing."
            exit 1
          fi

      # ============================================================
      # 5. JAVA 17
      #
      # IMPORTANT:
      # NO 'cache: gradle' HERE.
      # This fixes the exact error in your screenshot.
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 7. SETUP GRADLE
      #
      # Gradle caching is handled here AFTER the project is located.
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # ============================================================
      # 8. JAVA / GRADLE DIAGNOSTICS
      # ============================================================
      - name: Verify build environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "===== Java ====="
          java -version

          echo ""
          echo "===== Gradle ====="
          gradle --version

          echo ""
          echo "===== Android SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "===== Project ====="
          pwd
          ls -la

      # ============================================================
      # 9. CLEAN BUILD
      # ============================================================
      - name: Clean project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace

      # ============================================================
      # 10. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 11. BUILD RELEASE APK
      #
      # Continue so Debug APK can still be uploaded
      # if Release signing/config has a problem.
      # ============================================================
      - name: Build Release APK
        id: release_build
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 12. FIND APK FILES
      # ============================================================
      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" 2>/dev/null | head -n 1 || true)

          RELEASE_APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" 2>/dev/null | head -n 1 || true)

          echo "DEBUG_APK=$DEBUG_APK"
          echo "RELEASE_APK=$RELEASE_APK"

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            find "$PROJECT_DIR/app/build" -type f 2>/dev/null | sort | tail -200 || true
            exit 1
          fi

          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      # ============================================================
      # 13. APK INFO
      # ============================================================
      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp "$DEBUG_APK" artifacts/PopupLauncher-debug.apk
          sha256sum artifacts/PopupLauncher-debug.apk \
            > artifacts/PopupLauncher-debug.apk.sha256

          if [ -n "${RELEASE_APK:-}" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/PopupLauncher-release.apk
            sha256sum artifacts/PopupLauncher-release.apk \
              > artifacts/PopupLauncher-release.apk.sha256
          else
            echo "Release APK was not generated."
          fi

          echo "===== Final artifacts ====="
          ls -lh artifacts
          sha256sum artifacts/*.apk

      # ============================================================
      # 14. UPLOAD DEBUG APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-Debug-APK
          path: artifacts/PopupLauncher-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 15. UPLOAD RELEASE APK
      # ============================================================
      - name: Upload Release APK
        if: ${{ env.RELEASE_APK != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-Release-APK
          path: |
            artifacts/PopupLauncher-release.apk
            artifacts/PopupLauncher-release.apk.sha256
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 16. UPLOAD DEBUG CHECKSUM
      # ============================================================
      - name: Upload Debug checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-Checksums
          path: |
            artifacts/*.sha
